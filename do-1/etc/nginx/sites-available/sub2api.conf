include /etc/nginx/upstreams/sub2api-upstream.conf;
include /etc/nginx/upstreams/groq-upstream.conf;
include /etc/nginx/upstreams/anthropic-upstream.conf;
include /etc/nginx/upstreams/gemini-upstream.conf;
include /etc/nginx/upstreams/openai-upstream.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Backup internal-only gateway for sub2api & official LLM relays: accessible ONLY via loopback
# (127.0.0.1) and Tailscale CGNAT subnet (100.64.0.0/10).
server {
    listen 8080 default_server;
    server_name _;

    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    deny all;

    keepalive_timeout 120s;
    keepalive_requests 10000;
    client_max_body_size 128m;

    # Compress static frontend assets only; API JSON / SSE streams stay uncompressed
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # Stateless US egress relay for Groq official API (LLM + Responses + Orpheus TTS + Whisper STT)
    location ^~ /groq/ {
        proxy_pass https://groq_api/openai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.groq.com;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.groq.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Stateless US egress relay for Anthropic official API (/v1/messages, /v1/models)
    location ^~ /anthropic/ {
        proxy_pass https://anthropic_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.anthropic.com;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.anthropic.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Stateless US egress relay for Google Gemini official API (/v1beta/models/*)
    location ^~ /gemini/ {
        proxy_pass https://gemini_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_ssl_name generativelanguage.googleapis.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Stateless US egress relay for OpenAI official API (/v1/* including /v1/realtime WebSocket)
    location ^~ /openai/ {
        proxy_pass https://openai_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host api.openai.com;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request & response buffering for low-latency multimodal upload and SSE streaming
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# ACME HTTP-01 challenge endpoint for sub.tovo.sh auto-renewal
server {
    listen 80;
    server_name sub.tovo.sh;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sub2api-acme;
    }

    location / {
        return 403;
    }
}

# Primary HTTPS upstream gateway for nyh-prod-2026 (new-api -> sub2api & official LLM relays)
server {
    listen 443 ssl;
    server_name sub.tovo.sh;

    ssl_certificate /etc/letsencrypt/live/sub.tovo.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.tovo.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    keepalive_timeout 120s;
    keepalive_requests 10000;
    client_max_body_size 128m;

    # Keep ACME challenge open on 443 as well so renewal never hits IP allowlist
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sub2api-acme;
    }

    # Strictly restrict API access to nyh-prod-2026 public IP + Tailscale + loopback
    allow 8.217.145.133;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Compress static frontend assets only; API JSON / SSE streams stay uncompressed
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
