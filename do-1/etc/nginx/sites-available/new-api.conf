include /etc/nginx/upstreams/new-api-upstream.conf;

server {
    listen 80;
    server_name tovo.sh;
    location /.well-known/acme-challenge/ { root /var/www/tk-flywheel-acme; }
    location / { return 301 https://tovo.sh$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name tovo.sh;

    ssl_certificate /etc/letsencrypt/live/tovo.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tovo.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Multimodal requests (base64 images / audio / file relay) need larger body size
    client_max_body_size 64m;

    location / {
        proxy_pass http://new_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so SSE / streaming completions flush immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
