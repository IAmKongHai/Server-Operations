include /etc/nginx/upstreams/sub2api-upstream.conf;

# Backup internal-only gateway for sub2api: accessible ONLY via loopback (127.0.0.1)
# and Tailscale CGNAT subnet (100.64.0.0/10).
server {
    listen 8080 default_server;
    server_name _;

    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    deny all;

    keepalive_timeout 120s;
    keepalive_requests 10000;
    client_max_body_size 128m;

    # Compress static frontend assets only; API JSON / SSE streams stay uncompressed
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    location / {
        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request & response buffering for low-latency multimodal upload and SSE streaming
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# ACME HTTP-01 challenge endpoint for sub.tovo.sh auto-renewal
server {
    listen 80;
    server_name sub.tovo.sh;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sub2api-acme;
    }

    location / {
        return 403;
    }
}

# Primary HTTPS upstream gateway for nyh-prod-2026 (new-api -> sub2api)
server {
    listen 443 ssl;
    server_name sub.tovo.sh;

    ssl_certificate /etc/letsencrypt/live/sub.tovo.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.tovo.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    keepalive_timeout 120s;
    keepalive_requests 10000;
    client_max_body_size 128m;

    # Keep ACME challenge open on 443 as well so renewal never hits IP allowlist
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sub2api-acme;
    }

    # Strictly restrict API access to nyh-prod-2026 public IP + Tailscale + loopback
    allow 8.217.145.133;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Compress static frontend assets only; API JSON / SSE streams stay uncompressed
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    location / {
        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request & response buffering for low-latency multimodal upload and SSE streaming
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
