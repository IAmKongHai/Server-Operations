# 跨洋高 BDP 链路（香港 <-> 美西 ~156ms RTT，200Mbps）TCP 调优（2026-11-11）
# 1. BBR + fq：避免 cubic 在跨洋偶发尾丢包时大幅缩窗
# 2. tcp_slow_start_after_idle = 0：防止 Keep-Alive / HTTP/2 空闲连接超过 1s 后退回 10*MSS 慢启动，显著提速多模态大图/长上下文首包上传
# 3. 32 MiB socket buffer 上限：覆盖 200Mbps * 160ms BDP 裕量
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
