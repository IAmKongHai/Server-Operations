; 来源：nyh-prod /home/supervisor/profile/line-vtsi-smart-check.ini（宝塔 supervisor），命令不变
; 切换前 autostart=false，切换窗口内改成 true（见迁移计划 U5）
[program:line-vtsi-smart-check]
command=/www/wwwroot/python/nyh-line-core/.venv/bin/python -m nyh_line vtsi-smart check
directory=/www/wwwroot/python/nyh-line-core
environment=PYTHONUNBUFFERED="1"
stopasgroup=true
killasgroup=true
stopwaitsecs=60
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/www/wwwroot/python/nyh-line-core/logs/line-vtsi-smart-check.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
