; 来源：nyh-prod /home/supervisor/profile/nyh-notify.ini（宝塔 supervisor），命令不变
; 切换前 autostart=false，切换窗口内改成 true（见迁移计划 U5）
[program:nyh-notify]
command=/www/server/nyh-notify/nyh-notify serve -config /www/server/nyh-notify/config.json
directory=/www/server/nyh-notify/
user=nyh-notify
autostart=false
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/var/log/supervisor/nyh-notify.out.log
stderr_logfile=/var/log/supervisor/nyh-notify.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
priority=999
