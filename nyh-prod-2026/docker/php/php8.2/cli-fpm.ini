; 来源：nyh-prod 宝塔 /www/server/php/82/etc/php.ini（2026-11-10 导出）
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 60
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
date.timezone = Asia/Shanghai  ; 旧机是 PRC，Debian 13 的 tzdata 已把这个别名移到 tzdata-legacy，含义相同
short_open_tag = On
expose_php = Off
realpath_cache_size = 4096K
session.gc_maxlifetime = 259200
session.save_path = /www/php_session/82
cgi.fix_pathinfo = 0
opcache.enable = 1
opcache.enable_cli = 0
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
