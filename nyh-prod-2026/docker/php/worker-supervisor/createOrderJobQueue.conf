; 来源：nyh-prod /home/supervisor/profile/createOrderJobQueue.ini（宝塔 supervisor），命令和参数不变
; 日志改到宿主机挂载的 /www/wwwlogs/supervisor/
[program:createOrderJobQueue]
command=php74 /www/wwwroot/load.nanyahui.com/think queue:work --queue createOrderJobQueue --daemon --sleep 5
directory=/www/wwwroot/load.nanyahui.com/
autostart=true
autorestart=true
startsecs=0
startretries=0
stdout_logfile=/www/wwwlogs/supervisor/createOrderJobQueue.out.log
stderr_logfile=/www/wwwlogs/supervisor/createOrderJobQueue.err.log
stdout_logfile_maxbytes=2MB
stderr_logfile_maxbytes=2MB
user=www
priority=999
numprocs=5
process_name=%(program_name)s_%(process_num)02d
