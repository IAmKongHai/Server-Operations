# mp.nanyahui.com 反代规则（KTD4）。安装到 /etc/nginx/nyh/extension/mp.nanyahui.com/proxy.conf
# 宝塔站点 vhost 在 server 级 include extension 目录，面板保存站点时不会覆盖这里。
# 只反代后台；回调路径与健康检查在 nginx 层直接拒绝（回调只走 127.0.0.1:9871，不经 nginx）。
# 用 ^~ 前缀匹配，避免宝塔默认的 .js/.css/.png 正则 location 抢走 /admin/static/ 与图片预览。

location ^~ /wechat/ {
    return 404;
}

location = /healthz {
    return 404;
}

location = / {
    return 302 /admin/;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:9871;
    # Host 必须原样传：后台的 CrossOriginProtection 用它比对 Origin
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    # 图片上限 10MB，留出 multipart 开销
    client_max_body_size 12m;
}
