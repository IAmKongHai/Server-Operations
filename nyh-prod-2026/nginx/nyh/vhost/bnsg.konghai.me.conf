proxy_cache_path /www/dk_project/sites/bnsg.konghai.me/proxy_cache_dir levels=1:2 keys_zone=bnsg_konghai_me_cache:20m inactive=1d max_size=5g;
server {
    listen 80;
    listen 443 ssl;
    # listen 443 quic;  # disabled: Chrome H3/JS cancel mitigation
    http2 on;
    # http3 on;  # disabled: Chrome H3/JS cancel mitigation

    server_name bnsg.konghai.me;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/bnsg.konghai.me;
    include /etc/nginx/nyh/extension/bnsg.konghai.me/*.conf;
    

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /etc/nginx/nyh/snippets/acme.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /etc/letsencrypt/live/bnsg.konghai.me/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/bnsg.konghai.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+CHACHA20:ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!aNULL:!eNULL:!MD5:!DSS:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security $hsts_header always;
    # 安全响应头。注意 nginx 的 add_header 不跨层级叠加：
    # 若某个 location 自己写了 add_header，本层这些头在该 location 会全部失效，需就地重声明。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://webapi.amap.com https://*.amap.com; style-src 'self' 'unsafe-inline' https://webapi.amap.com https://*.amap.com; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; font-src 'self' data: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://webapi.amap.com https://restapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    # add_header Alt-Svc disabled (Chrome H3/JS cancel white-screen mitigation)
    # quic_retry off;
    # quic_gso off;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    #SSL-END
    #REDIRECT START
    
    
    #REDIRECT END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    
    
    #PHP-INFO-END
    
    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    
    #REWRITE-END

    #IP-RESTRICT-START 限制访问ip的配置，IP黑白名单
    
    #IP-RESTRICT-END

    #BASICAUTH START
    
    #BASICAUTH END

    #SUB_FILTER START
    
    #SUB_FILTER END

    #GZIP START
    
    #GZIP END

    #GLOBAL-CACHE START
    
    #GLOBAL-CACHE END

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    #WEBSOCKET-SUPPORT END

    #PROXY-CONF-START
    # 仅 API 反代到 Docker；前端静态由 root 提供
    # 登录限流。location = 精确匹配，优先级高于下方的 ^~ /api/。
    # zone 定义在 nginx.conf 的 http 级（zone=yunshu_login）。
    # 本 location 有自己的 add_header，因此 server 级的头必须在此重新声明。
    location = /api/v1/auth/login {
      limit_req zone=yunshu_login burst=5 nodelay;
      limit_req_status 429;
      add_header Strict-Transport-Security $hsts_header always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      proxy_pass http://127.0.0.1:3300;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_connect_timeout 60s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_http_version 1.1;
      client_max_body_size 1m;
    }

    location ^~ /api/ {
      proxy_pass http://127.0.0.1:3300;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Real-Port $remote_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header REMOTE-HOST $remote_addr;
      proxy_connect_timeout 60s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      client_max_body_size 32m;
    }
    #PROXY-CONF-END

            #SERVER-BLOCK-STATIC START
    # HTML / SPA 入口：禁止长缓存。部署后 hash 文件名会变；若 index.html 被浏览器长缓存，
    # Chrome 会继续请求已删除的旧 JS → 白屏。带 hash 的静态资源才长缓存。
    # 注意：location 内一旦写 add_header，server 级安全头不会叠加，须在此重声明。
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://webapi.amap.com https://*.amap.com; style-src 'self' 'unsafe-inline' https://webapi.amap.com https://*.amap.com; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; font-src 'self' data: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://webapi.amap.com https://restapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    }
    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://webapi.amap.com https://*.amap.com; style-src 'self' 'unsafe-inline' https://webapi.amap.com https://*.amap.com; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; font-src 'self' data: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://webapi.amap.com https://restapi.amap.com https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
      try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Access-Control-Allow-Origin "*" always;
      access_log off;
      try_files $uri =404;
    }
    #SERVER-BLOCK-STATIC END


    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location /.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    #LOG START
    
access_log  /www/wwwlogs/bnsg.konghai.me.log;
    error_log  /www/wwwlogs/bnsg.konghai.me.error.log;
    
    #LOG END
}