server
{
    listen 80;
    listen 443 ssl ;
    # UDP 443 的 reuseport 只能在一个 server 里声明，放在默认站点（2026-11-10）：
    # 没有 reuseport 时所有 worker 共用一个 UDP socket，同一 QUIC 连接的包会落到不同 worker，h3 连接中断。
    # 其它 vhost 继续写不带参数的 listen 443 quic，不要再加 reuseport（重复会导致 nginx -t 失败）。
    listen 443 quic reuseport;
    http2 on;
    server_name _;
    index index.html;
    root /var/www/html;

    # DEFAULT SSL CONFIG
    ssl_certificate    /etc/nginx/nyh/cert/0.default/fullchain.pem;
    ssl_certificate_key    /etc/nginx/nyh/cert/0.default/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+CHACHA20:ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!aNULL:!eNULL:!MD5:!DSS:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
}