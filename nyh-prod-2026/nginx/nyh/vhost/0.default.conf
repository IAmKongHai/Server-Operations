server
{
    listen 80;
    listen 443 ssl ;
    http2 on;
    server_name _;
    index index.html;
    root /var/www/html;

    # DEFAULT SSL CONFIG
    ssl_certificate    /etc/nginx/nyh/cert/0.default/fullchain.pem;
    ssl_certificate_key    /etc/nginx/nyh/cert/0.default/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+CHACHA20:ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!aNULL:!eNULL:!MD5:!DSS:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
}