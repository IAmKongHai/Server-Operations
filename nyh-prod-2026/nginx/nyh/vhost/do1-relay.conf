# Relay to do-1 (DigitalOcean US) sub2api gateway over Tailscale.
# Purpose: avoid lossy mainland->US UDP path; clients reach this HK node instead.
# Access restricted to loopback + Tailscale CGNAT range.
upstream do1_sub2api {
    server 100.86.92.103:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny all;

    client_max_body_size 64m;
    access_log /www/wwwlogs/do1-relay.log;
    error_log  /www/wwwlogs/do1-relay.error.log;

    location / {
        proxy_pass http://do1_sub2api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming passthrough (same as upstream)
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
