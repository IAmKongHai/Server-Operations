server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name load.nanyahui.cn;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/load.nanyahui.com/public;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /etc/nginx/nyh/snippets/acme.conf;
    #CERT-APPLY-CHECK--END
    include /etc/nginx/nyh/extension/load.nanyahui.cn/*.conf;
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /etc/letsencrypt/live/load.nanyahui.cn/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/load.nanyahui.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+CHACHA20:ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!aNULL:!eNULL:!MD5:!DSS:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include /etc/nginx/nyh/snippets/enable-php-74.conf;
    #PHP-INFO-END

    #OLD-PC-301-START  老 PC 页面迁移 vip.nanyahui.com 后的 301 重定向(精确白名单,勿用 ~ \.html$ 通配)
    location = /                          { return 301 https://vip.nanyahui.com/; }
    location = /index.html               { return 301 https://vip.nanyahui.com/; }
    location = /login.html               { return 301 https://vip.nanyahui.com/; }
    location = /order.html               { return 301 https://vip.nanyahui.com/; }
    location = /console.html             { return 301 https://vip.nanyahui.com/; }
    location = /smart.html               { return 301 https://vip.nanyahui.com/; }
    location = /globe.html               { return 301 https://vip.nanyahui.com/; }
    location = /cherry.html              { return 301 https://vip.nanyahui.com/; }
    location = /number_classification.html { return 301 https://vip.nanyahui.com/; }
    location = /basic_information.html    { return 301 https://vip.nanyahui.com/; }
    location = /top_up_now.html          { return 301 https://vip.nanyahui.com/; }
    location = /personal_center.html     { return 301 https://vip.nanyahui.com/; }
    location = /register.html            { return 301 https://vip.nanyahui.com/; }
    location = /home.html                { return 301 https://vip.nanyahui.com/; }
    location = /recharge.html            { return 301 https://vip.nanyahui.com/; }
    location = /page/intro.html          { return 301 https://vip.nanyahui.com/; }
    location ^~ /page/                    { return 301 https://vip.nanyahui.com/; }
    location ^~ /user/                    { return 301 https://vip.nanyahui.com/; }   # 废弃商家平台模块整目录
    location = /user                      { return 301 https://vip.nanyahui.com/; }   # 废弃商家平台裸路径
    #OLD-PC-301-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /etc/nginx/nyh/rewrite/load.nanyahui.cn.conf;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/load.nanyahui.cn.log;
    error_log  /www/wwwlogs/load.nanyahui.cn.error.log;
}
