# tovo.sh：new-api AI API 网关（2026-11-10 新增），反代 127.0.0.1:3200（/opt/stacks/new-api）
# 证书：certbot webroot，/etc/letsencrypt/live/tovo.sh/
server {
    listen 80;
    server_name tovo.sh;
    include /etc/nginx/nyh/snippets/acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    # HTTP/3：11-10 22:20 曾关闭，后查明是服务器侧没有 reuseport（已在 0.default.conf 修复），23:40 恢复。
    # 不要在这里加 reuseport，它只能在 0.default.conf 声明一次。
    listen 443 quic;
    http2 on;
    http3 on;
    server_name tovo.sh;

    ssl_certificate     /etc/letsencrypt/live/tovo.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tovo.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # 与 new-api 的 MAX_REQUEST_BODY_MB 默认 128 对齐：图生视频 / 参考视频会带 base64 大请求体
    client_max_body_size 128m;

    access_log /www/wwwlogs/tovo.sh.log;
    error_log  /www/wwwlogs/tovo.sh.error.log;

    include /etc/nginx/nyh/snippets/acme.conf;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # http.conf 全局开了 proxy_cache，并对 500/503/404 重试下一个上游：
        # 网关接口不能缓存，也不能重放（会重复提交任务、重复计费）
        proxy_cache off;
        proxy_next_upstream off;

        # SSE 流式输出和视频结果下载都不能被 nginx 攒着
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        # 高于 STREAMING_TIMEOUT=300 和插件同步等待上限 600s
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
