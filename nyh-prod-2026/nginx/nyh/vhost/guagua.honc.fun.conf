server {
    listen 80;
    server_name guagua.honc.fun;
    location /.well-known/acme-challenge/ { root /www/wwwroot/guagua/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name guagua.honc.fun;
    ssl_certificate     /etc/letsencrypt/live/guagua.honc.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guagua.honc.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;   # 截图 / 录音上传
    access_log /www/wwwlogs/guagua.honc.fun.log;
    error_log  /www/wwwlogs/guagua.honc.fun.error.log;

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /www/wwwroot/guagua/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # 模型慢
    }
}
