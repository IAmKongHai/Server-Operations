# Let's Encrypt HTTP-01 验证目录（certbot --webroot -w /var/www/letsencrypt）
# 替代宝塔 well-known/*.conf 里的 lua 实现
location ^~ /.well-known/acme-challenge/ {
    # 站点级有 allow/deny 白名单时（mp.nanyahui.com），验证请求也要放行；location 里写了访问规则就不再继承 server 级的
    allow all;
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
