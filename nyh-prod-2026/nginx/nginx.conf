# nyh-prod-2026 的 /etc/nginx/nginx.conf
# 结构：主配置（本文件）→ /etc/nginx/nyh/http.conf（公共 http 设置，照搬宝塔）
#       → /etc/nginx/nyh/vhost/*.conf（每个站点一个，由 scripts/convert-baota-nginx.py 从宝塔配置转写）
# 不使用 Debian 默认的 sites-enabled / conf.d，避免两套站点目录混用。
user  www www;
worker_processes auto;
worker_rlimit_nofile 51200;
pid /run/nginx.pid;
error_log  /www/wwwlogs/nginx_error.log  crit;
include /etc/nginx/modules-enabled/*.conf;

events {
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 密钥交换组写成一个优先级组（不用 OpenSSL 3.5 默认的 "/" 分组），客户端带了哪个组的 key share 就直接用，
    # 不发 HelloRetryRequest。原因：默认配置下 Cloudflare 回源先带 X25519，服务器要求改用 X25519MLKEM768，
    # Cloudflare 第二个 ClientHello 被 OpenSSL 判为 illegal_parameter，回源 525（2026-11-10 numbers.konghai.me）。
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

    include /etc/nginx/nyh/http.conf;
    include /etc/nginx/nyh/vhost/*.conf;
}
