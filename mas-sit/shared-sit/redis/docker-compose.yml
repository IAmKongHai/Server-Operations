name: shared-sit-redis
services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: shared-sit-redis
    restart: always
    env_file: .env
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--requirepass", "${REDIS_PASSWORD}",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "allkeys-lru",
      ]
    ports:
      - "127.0.0.1:6380:6379"
      - "100.109.223.53:6380:6379"
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - redis_data:/data
    networks:
      shared-sit:
        aliases: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  redis_data:
    name: shared_sit_redis_data
networks:
  shared-sit:
    name: shared-sit
    external: true
