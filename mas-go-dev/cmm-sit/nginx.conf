worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_x_real_ip $cmm_real_ip {
    "" $remote_addr;
    default $http_x_real_ip;
  }
  map $http_x_forwarded_proto $cmm_fwd_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
  }
  map $http_x_forwarded_for $cmm_fwd_for {
    "" $remote_addr;
    default $http_x_forwarded_for;
  }

  server {
    listen 0.0.0.0:8081;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~ ^/(healthz|readyz)$ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $cmm_fwd_proto;
      proxy_set_header X-Forwarded-For $cmm_fwd_for;
      proxy_set_header X-Real-IP $cmm_real_ip;
    }

    location /v1/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $cmm_fwd_proto;
      proxy_set_header X-Forwarded-For $cmm_fwd_for;
      proxy_set_header X-Real-IP $cmm_real_ip;
    }
  }
}
