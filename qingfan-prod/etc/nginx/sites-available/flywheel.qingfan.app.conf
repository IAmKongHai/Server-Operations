# flywheel.qingfan.app: tk-flywheel API and frontend on :8087.
# server_tokens and the default_server reject rules live in conf.d/00-defaults.conf.
server {
    listen 80;
    server_name flywheel.qingfan.app;
    location /.well-known/acme-challenge/ { root /var/www/tk-flywheel-acme; }
    location / { return 301 https://flywheel.qingfan.app$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name flywheel.qingfan.app;
    ssl_certificate /etc/letsencrypt/live/flywheel.qingfan.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flywheel.qingfan.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-cache";
    }
}
