include /etc/nginx/upstreams/qingfan-upstream.conf;

# qingfan.app: website, downloads and API proxied to qingfan_backend (Blue :8090 / Green :8091);
# admin console served as static files from the current release.
server {
    listen 80;
    server_name qingfan.app;
    location /.well-known/acme-challenge/ { root /var/www/qingfan-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name qingfan.app;

    ssl_certificate /etc/letsencrypt/live/qingfan.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qingfan.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # API replies are JSON; the 罗盘 category dictionary alone is 1.5 MB, 167 KB compressed.
    gzip_types application/json;
    gzip_proxied any;

    # Installers are uploaded through the admin console (500 MB cap in the server).
    client_max_body_size 600m;

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/qingfan/current/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://qingfan_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # qingfan-server trusts these two only from loopback, i.e. from this nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
