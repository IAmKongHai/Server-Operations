# Installed as /etc/nginx/conf.d/00-defaults.conf (split out of the DO-1 tk-flywheel.conf).
# server_tokens off is already set by Debian 13's stock nginx.conf.

# Requests by bare IP or an unknown Host get no site and no certificate.
server {
    listen 80 default_server;
    return 444;
}
server {
    listen 443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
}
