# sub2api 反向代理 @ dev-cypresso
# 服务器路径：/etc/nginx/conf.d/sub2api.cypresso.ai.conf
#
# 本文件是 certbot --nginx 改写之后的最终版本（2026-09-28 拉回），
# 含 443 server 块与 80→443 的 301。带 "managed by Certbot" 的行由 certbot 维护，
# 续期时可能被改写，不要手工编辑那几行。
#
# conf.d 被包含在 http 上下文，map 必须放在 server 外面。

map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    ""      "";
}

server {
  server_name sub2api.cypresso.ai;

  # Codex 粘性会话用带下划线的头（session_id）。默认会丢掉。
  underscores_in_headers on;

  location / {
    # upstream 写纯 IP，规避 nginx 开机时 DNS 未就绪导致启动失败
    proxy_pass http://127.0.0.1:18180;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sub2api_connection_upgrade;

    # SSE：缓冲必须关，否则整段输出被 Nginx 攒着直到结束
    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 60s;
    # 长流与图片生成。应用侧图片流间隔超时默认 900s，这里留余量
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # 对齐应用默认请求体上限 256MB，覆盖宿主 http 级的 100M
    client_max_body_size 256m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sub2api.cypresso.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sub2api.cypresso.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = sub2api.cypresso.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name sub2api.cypresso.ai;
    return 404; # managed by Certbot


}
