# new-api 反向代理 @ dev-cypresso
# 服务器路径：/etc/nginx/conf.d/zzz.konghai.me.conf
#
# 本文件是 certbot --nginx 改写「之后」的最终版本（2026-09-18 拉回），
# 含 443 server 块与 80→443 的 301。带 "managed by Certbot" 注释的行由 certbot 维护，
# 续期时可能被改写，不要手工编辑那几行。
server {
  server_name zzz.konghai.me;

  location / {
    # upstream 写纯 IP，规避 nginx 开机时 DNS 未就绪导致启动失败的既有故障
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SSE 流式响应：缓冲必须关，否则整段输出被 Nginx 攒着直到结束（R4）
    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 60s;
    # 读写超时高于 new-api 的 STREAMING_TIMEOUT=300s，留一倍余量
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # 与 new-api 的 MAX_REQUEST_BODY_MB 默认值 128 对齐，
    # 覆盖宿主 http 级的 client_max_body_size 100M
    client_max_body_size 128m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zzz.konghai.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zzz.konghai.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = zzz.konghai.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name zzz.konghai.me;
    return 404; # managed by Certbot


}