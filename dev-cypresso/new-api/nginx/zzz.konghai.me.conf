# new-api 反向代理 @ dev-cypresso
# 服务器路径：/etc/nginx/conf.d/zzz.konghai.me.conf
#
# 本文件是 certbot 改写「之前」的 HTTP 版本。U5 跑完 certbot --nginx 后，
# certbot 会追加 443 server 块与 80→443 的 301，届时把服务器上的最终版本拉回覆盖本文件。
server {
  listen 80;
  listen [::]:80;
  server_name zzz.konghai.me;

  location / {
    # upstream 写纯 IP，规避 nginx 开机时 DNS 未就绪导致启动失败的既有故障
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SSE 流式响应：缓冲必须关，否则整段输出被 Nginx 攒着直到结束（R4）
    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 60s;
    # 读写超时高于 new-api 的 STREAMING_TIMEOUT=300s，留一倍余量
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # 与 new-api 的 MAX_REQUEST_BODY_MB 默认值 128 对齐，
    # 覆盖宿主 http 级的 client_max_body_size 100M
    client_max_body_size 128m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
